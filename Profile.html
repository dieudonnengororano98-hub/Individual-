<!DOCTYPE html>
<html lang="en">

    <title>Profile</title>

    <link rel="stylesheet" href="./Profile.css">
</head>

<body>

    <div class="container">
        <div class="students">StudentEats</div>

        <div class="menu-icon">
            <span></span>

    <div class="page">

            <div class="top">

                <img

                    src="./public/edward-howell-vvUy1hWVYEA-unsplash.jpg"

                <input
                    id="email"
                    type="email"

                >

                <input

                    type="text"
                    placeholder="Enter your phone number"
                >

                <button
                    type="submit"
                    class="save"

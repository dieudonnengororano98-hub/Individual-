<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Restaurants.css">
    <title>Restaurants</title>
</head>

<body>

    <div class="container">

        <div class="students">
            StudentEats
        </div>

        <a class="Restaurant" href="./Restaurants.html">
            Restaurants
        </a>

        <a class="map" href="./map.html">
            Map
        </a>

        <a class="favorites" href="./favorites.html">
            Favorites
        </a>

        <a class="profile" href="./profile.html">
            Profile
        </a>

    </div>

    <div class="img">

        <img
            src="./public/hikaru-sano-M0meqCjZEKg-unsplash.jpg"
            alt="Restaurant"
        >

        <div class="content">

            <h1 class="hero-title">
                Find Your Favorite Restaurant<br>
                in Finland
            </h1>

            <input
                id="search-input"
                class="search-input"
                type="text"
                placeholder="Search Restaurants"
            >

            <div class="filter">

                <select id="city-filter">
                    <option value="">All cities</option>
                </select>

                <select id="provider-filter">
                    <option value="">All providers</option>
                </select>

                <button
                    id="search-button"
                    class="second-search"
                    type="button"
                >
                    Search
                </button>

            </div>

        </div>

    </div>

    <div class="menu-buttons">

        <a
            class="daily-menu"
            href="./Daily-menu.html"
        >
            Daily menu
        </a>

        <a
            class="weekly-menu"
            href="./Weekly-menu.html"
        >
            Weekly menu
        </a>

    </div>

    <h1 class="p">
        Restaurants
    </h1>

    <div class="by">

        <p class="p-1">
            Sort by
        </p>

        <select id="sort-filter">

            <option value="">
                Default
            </option>

            <option value="name">
                Name: A to Z
            </option>

            <option value="city">
                City
            </option>

        </select>

    </div>

    <div
        id="restaurant-list"
        class="restaurant-cards"
    ></div>

    <script src="./Restaurants.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StudentEats</title>
    <link rel="stylesheet" href="./Log in.css">
</head>

<body>

    <div class="container">
        <div class="students">StudentEats</div>

        <div class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <div class="login-box">

        <div class="tabs">
            <a class="login-tab" href="./login.html">Login</a>
            <a class="register-tab" href="./register.html">Register</a>
        </div>

        <form id="login-form">

            <label for="email">Email address</label>
            <input
                id="email"
                type="email"
                placeholder="you@example.com"
                required
            >

            <label for="password">Password</label>
            <input
                id="password"
                type="password"
                required
            >

            <button class="create-account" type="submit">
                Log in
            </button>

            <p id="login-message"></p>

            <a class="forgot" href="#">Forgot password?</a>

            <div class="or">
                <span></span>
                <p>or</p>
                <span></span>
            </div>

            <button class="github" type="button">
                Continue with GitHub
            </button>

        </form>

    </div>

    <script src="./Log in.js"></script>

</body>

</html>

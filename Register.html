<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - StudentEats</title>
    <link rel="stylesheet" href="./Register.css">
</head>

<body>

    <div class="container">
        <div class="students">StudentEats</div>

        <div class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <div class="register-box">

        <div class="tabs">
            <a class="login-tab" href="./Log in.html">Login</a>
            <a class="register-tab" href="./Register.html">Register</a>
        </div>

        <form id="register-form">

            <label for="name">Full name</label>
            <input
                id="name"
                type="text"
                placeholder="Your name"
                required
            >

            <label for="email">Email address</label>
            <input
                id="email"
                type="email"
                placeholder="Email"
                required
            >

            <label for="password">Password</label>
            <input
                id="password"
                type="password"
                placeholder="Password"
                required
            >

            <label for="confirm-password">Confirm password</label>
            <input
                id="confirm-password"
                type="password"
                placeholder="Confirm password"
                required
            >

            <button class="create-account" type="submit">
                Create account
            </button>

            <p id="register-message"></p>

        </form>

    </div>

    <script src="./Register.js"></script>

</body>

</html>
